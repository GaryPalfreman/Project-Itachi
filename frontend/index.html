<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itachi</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<main><header><span class="mark">鼬</span><div><h1>ITACHI</h1><small>LOCAL KNOWLEDGE INTERFACE</small></div><span id="status">CONNECTING</span></header>
<section class="stage"><canvas id="face" aria-label="Audio reactive node face"></canvas><div class="halo"></div><span class="caption" id="state">INITIALIZING</span></section>
<section class="panel"><div id="log" role="log" aria-live="polite"><p class="system">System ready. Choose a route and speak or type.</p></div>
<div class="controls"><select id="route" aria-label="Model route"><option value="auto">Autonomous · plan and use tools</option><option value="reasoning">Reasoning · configured model</option><option value="code">Code · configured endpoint</option><option value="openclaw">OpenClaw agent</option><option value="research">Research · JEV adapter</option></select><label class="web-toggle"><input type="checkbox" id="web">Allow web search</label><button id="mic" title="Record voice">MIC</button><button id="voice" aria-pressed="false" title="Read replies aloud">VOICE OFF</button></div>
<form id="form"><input id="prompt" autocomplete="off" placeholder="Ask Itachi…" maxlength="8000" aria-label="Prompt"><button>SEND</button></form><small class="hint">No personal knowledge loaded · tool access depends on configured providers</small></section></main><script type="module" src="/assets/main.js"></script></body></html>
