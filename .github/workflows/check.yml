name: Check
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend/app
      - run: python -m py_compile streamlit_app.py
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.app.main import app
          with TestClient(app) as client:
              assert client.get('/').status_code == 200
              assert client.get('/api/health').status_code == 200
              assert client.get('/api/graph').status_code == 403
              assert client.get('/api/health').json()['knowledge_enabled'] is False
          PY
      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('streamlit_app.py').run()
          assert not app.exception
          assert app.title[0].value == 'ITACHI'
          PY
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in frontend/*.js; do node --input-type=module --check < "$file"; done
