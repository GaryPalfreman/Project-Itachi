name: Refresh and learn public knowledge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/public_catalog.json'
      - 'data/knowledge/**'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: itachi-public-knowledge-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move learning writes off the deployment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin itachi-knowledge || true
          if git show-ref --verify --quiet refs/remotes/origin/itachi-knowledge; then
            git switch -C itachi-knowledge origin/itachi-knowledge
            git merge --no-edit "$GITHUB_SHA"
          else
            git switch -c itachi-knowledge
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Refresh allowlisted public repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh_public_catalog
      - name: Grow bounded public knowledge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.continuous_learning
      - name: Replicate public knowledge to Supabase when configured
        env:
          ITACHI_SUPABASE_URL: ${{ secrets.ITACHI_SUPABASE_URL }}
          ITACHI_SUPABASE_SERVER_KEY: ${{ secrets.ITACHI_SUPABASE_SERVER_KEY }}
        run: python -m scripts.sync_supabase_knowledge
      - name: Replicate a throttled subset to Zep when configured
        env:
          ITACHI_ZEP_API_KEY: ${{ secrets.ITACHI_ZEP_API_KEY }}
        run: |
          if [ -n "$ITACHI_ZEP_API_KEY" ]; then
            python -m pip install 'zep-cloud>=3,<4'
            python -m scripts.sync_zep_knowledge
          else
            echo "Zep replica not configured"
          fi
      - name: Mirror recovery snapshot to Google Drive when configured
        env:
          ITACHI_GOOGLE_API_KEY: ${{ secrets.ITACHI_GOOGLE_API_KEY }}
          ITACHI_GOOGLE_OAUTH_JSON: ${{ secrets.ITACHI_GOOGLE_OAUTH_JSON }}
          ITACHI_GOOGLE_CLIENT_ID: ${{ secrets.ITACHI_GOOGLE_CLIENT_ID }}
          ITACHI_GOOGLE_CLIENT_SECRET: ${{ secrets.ITACHI_GOOGLE_CLIENT_SECRET }}
          ITACHI_GOOGLE_REFRESH_TOKEN: ${{ secrets.ITACHI_GOOGLE_REFRESH_TOKEN }}
          ITACHI_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.ITACHI_GOOGLE_DRIVE_FOLDER_ID }}
        run: python -m scripts.sync_google_drive
      - name: Mirror recovery snapshot to MEGA when configured
        env:
          ITACHI_MEGA_EMAIL: ${{ secrets.ITACHI_MEGA_EMAIL }}
          ITACHI_MEGA_PASSWORD: ${{ secrets.ITACHI_MEGA_PASSWORD }}
        run: |
          if [ -z "$ITACHI_MEGA_EMAIL" ] || [ -z "$ITACHI_MEGA_PASSWORD" ]; then
            echo "MEGA recovery mirror not configured"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          bash scripts/sync_mega_rclone.sh
      - name: Keep recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itachi-public-knowledge
          path: |
            data/public_catalog.json
            data/knowledge/public_knowledge.jsonl
            data/knowledge/state.json
          retention-days: 90
      - name: Save refreshed knowledge outside the deployment branch
        run: |
          git add data/public_catalog.json data/knowledge
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Itachi public knowledge'
          fi
          git push origin HEAD:itachi-knowledge
      - name: Optional HTTPS mirrors
        env:
          ITACHI_MIRRORS_JSON: ${{ secrets.ITACHI_MIRRORS_JSON }}
          ITACHI_MIRROR_TOKEN_1: ${{ secrets.ITACHI_MIRROR_TOKEN_1 }}
          ITACHI_MIRROR_TOKEN_2: ${{ secrets.ITACHI_MIRROR_TOKEN_2 }}
          ITACHI_MIRROR_TOKEN_3: ${{ secrets.ITACHI_MIRROR_TOKEN_3 }}
        run: python -m scripts.mirror_public_catalog
