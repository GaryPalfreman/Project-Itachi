name: Refresh and learn public knowledge
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: itachi-public-knowledge-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Refresh allowlisted public repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.refresh_public_catalog
      - name: Grow bounded public knowledge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.continuous_learning
      - name: Replicate public knowledge to Supabase when configured
        env:
          ITACHI_SUPABASE_URL: ${{ secrets.ITACHI_SUPABASE_URL }}
          ITACHI_SUPABASE_SERVER_KEY: ${{ secrets.ITACHI_SUPABASE_SERVER_KEY }}
        run: python -m scripts.sync_supabase_knowledge
      - name: Keep recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itachi-public-knowledge
          path: |
            data/public_catalog.json
            data/knowledge/public_knowledge.jsonl
            data/knowledge/state.json
          retention-days: 90
      - name: Save refreshed knowledge in Git history
        run: |
          git add data/public_catalog.json data/knowledge
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Itachi public knowledge'
            git push
          fi
      - name: Optional HTTPS mirrors
        env:
          ITACHI_MIRRORS_JSON: ${{ secrets.ITACHI_MIRRORS_JSON }}
          ITACHI_MIRROR_TOKEN_1: ${{ secrets.ITACHI_MIRROR_TOKEN_1 }}
          ITACHI_MIRROR_TOKEN_2: ${{ secrets.ITACHI_MIRROR_TOKEN_2 }}
          ITACHI_MIRROR_TOKEN_3: ${{ secrets.ITACHI_MIRROR_TOKEN_3 }}
        run: python -m scripts.mirror_public_catalog
