name: Recover Itachi public knowledge
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: itachi-public-knowledge-writes
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Recover from Supabase
        env:
          ITACHI_SUPABASE_URL: ${{ secrets.ITACHI_SUPABASE_URL }}
          ITACHI_SUPABASE_SERVER_KEY: ${{ secrets.ITACHI_SUPABASE_SERVER_KEY }}
        run: python -m scripts.recover_supabase_knowledge
      - name: Commit recovered snapshot
        run: |
          git add data/knowledge/public_knowledge.jsonl
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Recover Itachi public knowledge from Supabase'
            git push
          fi
